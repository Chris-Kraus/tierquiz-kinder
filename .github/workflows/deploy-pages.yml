name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig, laufende Deployments nicht abbrechen
# (Standardmuster aus GitHubs eigenen Pages-Workflow-Vorlagen).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      # Node 22.23.2 bündelt npm 10.9.8. Diese (und alle npm-Versionen bis
      # einschließlich 11.11.0) haben einen bestätigten Bug: `npm ci` markiert
      # Plattform-Binärpakete, die nur über eine optionale Peer-Dependency in
      # den Baum gelangen (hier: esbuild@0.28.2 via vitest -> genestetes vite),
      # im Lockfile korrekt als "extraneous", vergisst dabei aber das
      # "optional"-Flag zu berücksichtigen – npm ci behandelt sie dadurch als
      # hart erforderlich und bricht mit EBADPLATFORM ab, sobald die aktuelle
      # Plattform (z. B. Linux x64) nicht zufällig zum ersten gefundenen
      # Plattform-Paket passt. Ab npm 11.12.0 ist das behoben
      # (empirisch verifiziert: 11.11.0 schlägt fehl, 11.12.0 nicht mehr).
      # Siehe Issue #108.
      - name: Pin npm to a version without the EBADPLATFORM/extraneous bug
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
